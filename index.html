```html
<script>
  /* =========================
     LOAD ARTICLES
     ========================= */

  async function loadArticles() {
    const articleList = document.getElementById("article-list");
    const viewMoreWrapper = document.getElementById("view-more-wrapper");
    const viewMoreBtn = document.getElementById("view-more-btn");

    if (!articleList || !viewMoreWrapper || !viewMoreBtn) {
      console.error("Required article elements were not found.");
      return;
    }

    try {
      const response = await fetch("articles.json", {
        cache: "no-cache"
      });

      if (!response.ok) {
        throw new Error("Unable to load articles.json");
      }

      const articles = await response.json();

      if (!Array.isArray(articles)) {
        throw new Error("articles.json must contain an array.");
      }

      articleList.innerHTML = "";
      viewMoreWrapper.style.display = "none";

      articles.forEach((article, index) => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = article.url;

        if (index >= 3) {
          card.classList.add("article-hidden");
        }

        const category = document.createElement("div");
        category.className = "category";
        category.textContent = article.category || "Insight";

        const title = document.createElement("h3");
        title.textContent = article.title || "Untitled Article";

        const description = document.createElement("p");
        description.textContent = article.description || "";

        card.appendChild(category);
        card.appendChild(title);
        card.appendChild(description);

        if (article.date) {
          const meta = document.createElement("div");
          meta.className = "article-meta";
          meta.textContent = article.date;
          card.appendChild(meta);
        }

        const linkText = document.createElement("span");
        linkText.className = "article-link";
        linkText.textContent = "Read Article →";
        card.appendChild(linkText);

        articleList.appendChild(card);
      });

      if (articles.length > 3) {
        viewMoreWrapper.style.display = "block";

        let expanded = false;

        viewMoreBtn.onclick = () => {
          expanded = !expanded;

          document.querySelectorAll(".article-hidden").forEach(article => {
            article.style.display = expanded ? "block" : "none";
          });

          viewMoreBtn.textContent = expanded
            ? "Show Fewer Articles"
            : "View More Articles";
        };
      }
    } catch (error) {
      console.error("Failed to load articles:", error);

      articleList.innerHTML = "";

      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = "Articles unavailable";

      const description = document.createElement("p");
      description.textContent =
        "Please check articles.json and try again.";

      card.appendChild(title);
      card.appendChild(description);
      articleList.appendChild(card);
    }
  }

  /* =========================
     START
     ========================= */

  loadArticles();
</script>
```
