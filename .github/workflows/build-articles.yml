name: Build Article Index

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # Update article navigation
      # ==========================================

      - name: Update article navigation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------
          # Article groups
          # ------------------------------------------

          insight_groups = {

              "Vehicle Monitors": [
                  "how-to-choose-vehicle-monitor.html",
                  "1920x1080-vs-1024x600.html",
                  "what-brightness-does-a-vehicle-monitor-need.html",
                  "why-vehicle-monitor-has-emi-problems.html",
                  "Why Is an Automotive Touchscreen Different from a Normal Tablet.html",
                  "why-vehicle-monitors-use-m12-connectors.html",
                  "bench-test-vs-installation.html"
              ],

              "SVM / AVM": [
                  "monitor-as-hmi-in-svm-system.html",
                  "svm-display-resolution-system-matching.html",
                  "why-svm-avm-needs-proper-display-interface.html",
                  "when-does-an-svm-monitor-need-touch.html",
                  "5-things-to-check-when-connecting-svm-box-to-vehicle-monitor.html",
                  "hdmi-vs-ahd-vehicle-camera-system.html"
              ],

              "Vehicle Safety": [
                  "why-wiring-matters.html",
                  "why-vehicle-camera-image-quality-changes-after-installation.html"
              ],

              "Wiring & Connectivity": [
                  "why-cables-can-matter-more-than-power-supply.html"
              ]
          }


          # ------------------------------------------
          # Common navigation HTML
          # ------------------------------------------

          header_html = r'''
          <header class="site-header">

              <div class="site-nav">

                  <div class="site-logo">
                      JACKY LIU
                  </div>

                  <nav class="desktop-nav">

                      <a href="index.html" class="site-nav-link">
                          Focus
                      </a>

                      <div class="site-insights">

                          <button class="site-insights-button">
                              Insights <span>▼</span>
                          </button>

                          <div class="site-dropdown">

                              <div class="site-dropdown-inner">

                                  <div class="site-dropdown-group">
                                      <div class="site-dropdown-title">
                                          Vehicle Monitors
                                      </div>
                                      <div id="vehicle-monitors-menu"></div>
                                  </div>

                                  <div class="site-dropdown-group">
                                      <div class="site-dropdown-title">
                                          SVM / AVM
                                      </div>
                                      <div id="svm-avm-menu"></div>
                                  </div>

                                  <div class="site-dropdown-group">
                                      <div class="site-dropdown-title">
                                          Vehicle Safety
                                      </div>
                                      <div id="vehicle-safety-menu"></div>
                                  </div>

                                  <div class="site-dropdown-group">
                                      <div class="site-dropdown-title">
                                          Wiring & Connectivity
                                      </div>
                                      <div id="wiring-menu"></div>
                                  </div>

                              </div>

                          </div>

                      </div>

                      <a href="index.html#problems" class="site-nav-link">
                          Problems
                      </a>

                      <a href="index.html#about" class="site-nav-link">
                          About
                      </a>

                      <a href="index.html#contact" class="site-nav-link">
                          Contact
                      </a>

                  </nav>


                  <button
                      class="mobile-menu-toggle"
                      onclick="toggleArticleMobileMenu()"
                      aria-label="Open navigation menu">
                      ☰
                  </button>

              </div>


              <div class="mobile-article-menu" id="mobileArticleMenu">

                  <a href="index.html">
                      Focus
                  </a>

                  <div class="mobile-section-title">
                      Insights
                  </div>

                  <div class="mobile-submenu">

                      <div class="mobile-group-title">
                          Vehicle Monitors
                      </div>

                      <div id="mobile-vehicle-monitors-menu"></div>

                      <div class="mobile-group-title">
                          SVM / AVM
                      </div>

                      <div id="mobile-svm-avm-menu"></div>

                      <div class="mobile-group-title">
                          Vehicle Safety
                      </div>

                      <div id="mobile-vehicle-safety-menu"></div>

                      <div class="mobile-group-title">
                          Wiring & Connectivity
                      </div>

                      <div id="mobile-wiring-menu"></div>

                  </div>

                  <a href="index.html#problems">
                      Problems
                  </a>

                  <a href="index.html#about">
                      About
                  </a>

                  <a href="index.html#contact">
                      Contact
                  </a>

              </div>

          </header>
          '''


          # ------------------------------------------
          # Common navigation CSS
          # ------------------------------------------

          navigation_css = r'''
          /* ==========================================
             UNIFIED ARTICLE NAVIGATION
             ========================================== */

          .site-header {
              background: #111;
              color: white;
              width: 100%;
          }

          .site-nav {
              max-width: 1100px;
              margin: 0 auto;
              padding: 20px 24px;
              display: flex;
              justify-content: space-between;
              align-items: center;
          }

          .site-logo {
              font-weight: bold;
              letter-spacing: 2px;
              color: white;
              white-space: nowrap;
          }

          .desktop-nav {
              display: flex;
              align-items: center;
              gap: 26px;
          }

          .site-nav-link {
              color: white !important;
              text-decoration: none !important;
              font-size: 14px;
              font-weight: normal !important;
          }

          .site-nav-link:hover {
              color: #ccc !important;
          }

          .site-insights {
              position: relative;
          }

          .site-insights-button {
              background: none;
              border: none;
              color: white;
              font-family: inherit;
              font-size: 14px;
              cursor: pointer;
              padding: 0;
          }

          .site-insights-button span {
              font-size: 10px;
              margin-left: 4px;
          }

          .site-dropdown {
              display: none;
              position: absolute;
              top: 28px;
              right: 0;
              width: 380px;
              background: #111;
              border: 1px solid #333;
              padding: 18px;
              z-index: 9999;
              box-shadow: 0 10px 30px rgba(0,0,0,0.35);
          }

          .site-insights:hover .site-dropdown {
              display: block;
          }

          .site-dropdown-inner {
              display: flex;
              flex-direction: column;
              gap: 18px;
          }

          .site-dropdown-group {
              display: block;
          }

          .site-dropdown-title {
              color: #999;
              font-size: 12px;
              letter-spacing: 1px;
              text-transform: uppercase;
              margin-bottom: 6px;
          }

          .site-dropdown-link {
              display: block;
              color: white !important;
              text-decoration: none !important;
              font-size: 13px;
              line-height: 1.5;
              margin: 7px 0;
              font-weight: normal !important;
          }

          .site-dropdown-link:hover {
              color: #ccc !important;
          }

          .mobile-menu-toggle {
              display: none;
              background: none;
              border: none;
              color: white;
              font-size: 25px;
              cursor: pointer;
          }

          .mobile-article-menu {
              display: none;
              background: #111;
              padding: 0 24px 22px;
          }

          .mobile-article-menu > a {
              display: block;
              color: white !important;
              text-decoration: none !important;
              padding: 10px 0;
              font-size: 14px;
          }

          .mobile-section-title {
              color: white;
              font-size: 14px;
              padding: 10px 0 5px;
          }

          .mobile-submenu {
              padding-left: 15px;
          }

          .mobile-group-title {
              color: #999;
              font-size: 11px;
              letter-spacing: 1px;
              text-transform: uppercase;
              margin-top: 12px;
              margin-bottom: 5px;
          }

          .mobile-submenu a {
              display: block;
              color: #bbb !important;
              text-decoration: none !important;
              font-size: 13px;
              line-height: 1.5;
              padding: 6px 0;
          }

          @media (max-width: 700px) {

              .desktop-nav {
                  display: none;
              }

              .mobile-menu-toggle {
                  display: block;
              }

              .site-nav {
                  padding: 18px 24px;
              }

          }
          '''


          # ------------------------------------------
          # Navigation JavaScript
          # ------------------------------------------

          navigation_js = r'''
          <script>

          const articleInsightGroups = {
          '''

          import json

          navigation_js += json.dumps(
              insight_groups,
              ensure_ascii=False,
              indent=4
          )

          navigation_js += r'''
          };


          async function loadArticleInsightsMenu() {

              try {

                  const response = await fetch("articles.json");

                  if (!response.ok) {
                      throw new Error("Unable to load articles.json");
                  }

                  const articles = await response.json();

                  const articleMap = {};

                  articles.forEach(article => {
                      articleMap[article.url] = article.title;
                  });


                  Object.entries(articleInsightGroups).forEach(
                      ([group, urls]) => {

                          let desktopHTML = "";
                          let mobileHTML = "";

                          urls.forEach(url => {

                              const title = articleMap[url];

                              if (!title) {
                                  return;
                              }

                              desktopHTML += `
                                  <a
                                      class="site-dropdown-link"
                                      href="${url}">
                                      ${title}
                                  </a>
                              `;

                              mobileHTML += `
                                  <a href="${url}">
                                      ${title}
                                  </a>
                              `;

                          });


                          if (group === "Vehicle Monitors") {

                              const desktop =
                                  document.getElementById(
                                      "vehicle-monitors-menu"
                                  );

                              const mobile =
                                  document.getElementById(
                                      "mobile-vehicle-monitors-menu"
                                  );

                              if (desktop) {
                                  desktop.innerHTML = desktopHTML;
                              }

                              if (mobile) {
                                  mobile.innerHTML = mobileHTML;
                              }

                          }


                          if (group === "SVM / AVM") {

                              const desktop =
                                  document.getElementById(
                                      "svm-avm-menu"
                                  );

                              const mobile =
                                  document.getElementById(
                                      "mobile-svm-avm-menu"
                                  );

                              if (desktop) {
                                  desktop.innerHTML = desktopHTML;
                              }

                              if (mobile) {
                                  mobile.innerHTML = mobileHTML;
                              }

                          }


                          if (group === "Vehicle Safety") {

                              const desktop =
                                  document.getElementById(
                                      "vehicle-safety-menu"
                                  );

                              const mobile =
                                  document.getElementById(
                                      "mobile-vehicle-safety-menu"
                                  );

                              if (desktop) {
                                  desktop.innerHTML = desktopHTML;
                              }

                              if (mobile) {
                                  mobile.innerHTML = mobileHTML;
                              }

                          }


                          if (group === "Wiring & Connectivity") {

                              const desktop =
                                  document.getElementById(
                                      "wiring-menu"
                                  );

                              const mobile =
                                  document.getElementById(
                                      "mobile-wiring-menu"
                                  );

                              if (desktop) {
                                  desktop.innerHTML = desktopHTML;
                              }

                              if (mobile) {
                                  mobile.innerHTML = mobileHTML;
                              }

                          }

                      }
                  );

              }

              catch (error) {

                  console.error(
                      "Article Insights menu error:",
                      error
                  );

              }

          }


          function toggleArticleMobileMenu() {

              const menu =
                  document.getElementById(
                      "mobileArticleMenu"
                  );

              if (!menu) {
                  return;
              }

              if (menu.style.display === "block") {

                  menu.style.display = "none";

              } else {

                  menu.style.display = "block";

              }

          }


          loadArticleInsightsMenu();

          </script>
          '''


          # ------------------------------------------
          # Process every article HTML file
          # ------------------------------------------

          excluded = {
              "index.html",
              "404.html"
          }


          for file in Path(".").glob("*.html"):

              if file.name in excluded:
                  continue

              text = file.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )


              # Only process pages that contain an article.
              # This avoids touching unrelated HTML files.

              if "<article" not in text.lower():
                  continue


              # --------------------------------------
              # Replace the existing header
              # --------------------------------------

              new_text, header_count = re.subn(
                  r"<header\b[^>]*>.*?</header>",
                  header_html.strip(),
                  text,
                  count=1,
                  flags=re.I | re.S
              )


              if header_count == 0:
                  print(
                      f"SKIPPED HEADER: {file.name} "
                      f"(no header found)"
                  )
                  continue


              # --------------------------------------
              # Remove previously generated navigation CSS
              # if the workflow runs again.
              # --------------------------------------

              new_text = re.sub(
                  r"/\* ==========================================\s*"
                  r"UNIFIED ARTICLE NAVIGATION.*?"
                  r"========================================== \*/.*?"
                  r"(?=@media|</style>)",
                  "",
                  new_text,
                  flags=re.I | re.S
              )


              # --------------------------------------
              # Insert navigation CSS before </style>
              # --------------------------------------

              if "site-header" not in new_text:

                  new_text = new_text.replace(
                      "</style>",
                      navigation_css.strip()
                      + "\n\n</style>",
                      1
                  )

              else:

                  # The replacement above may have left the
                  # class name in the header, so ensure CSS exists.
                  if "site-dropdown" not in new_text:
                      new_text = new_text.replace(
                          "</style>",
                          navigation_css.strip()
                          + "\n\n</style>",
                          1
                      )


              # --------------------------------------
              # Remove old navigation JS if generated
              # by an earlier run.
              # --------------------------------------

              new_text = re.sub(
                  r"<script>\s*const articleInsightGroups\s*=.*?</script>",
                  "",
                  new_text,
                  flags=re.I | re.S
              )


              # --------------------------------------
              # Add navigation JavaScript before </body>
              # --------------------------------------

              new_text = new_text.replace(
                  "</body>",
                  navigation_js.strip()
                  + "\n\n</body>",
                  1
              )


              file.write_text(
                  new_text,
                  encoding="utf-8"
              )


              print(
                  f"UPDATED NAVIGATION: {file.name}"
              )


          PY


      # ==========================================
      # Generate articles.json
      # ==========================================

      - name: Generate articles.json
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          articles = []

          excluded = {
              "index.html",
              "404.html"
          }

          for file in Path(".").glob("*.html"):

              if file.name in excluded:
                  continue

              text = file.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              title_match = re.search(
                  r"<title[^>]*>(.*?)</title>",
                  text,
                  re.I | re.S
              )

              description_match = re.search(
                  r'<meta[^>]+name=["\']description["\'][^>]+content=["\'](.*?)["\']',
                  text,
                  re.I | re.S
              )

              category_match = re.search(
                  r'<div[^>]*class=["\'][^"\']*category[^"\']*["\'][^>]*>(.*?)</div>',
                  text,
                  re.I | re.S
              )

              date_match = re.search(
                  r'(January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},\s+\d{4}',
                  text,
                  re.I
              )

              if not title_match:
                  continue

              title = re.sub(
                  r"\s+",
                  " ",
                  title_match.group(1)
              ).strip()

              title = re.sub(
                  r"\s*\|\s*Jacky Liu\s*$",
                  "",
                  title,
                  flags=re.I
              )

              description = ""

              if description_match:

                  description = re.sub(
                      r"\s+",
                      " ",
                      description_match.group(1)
                  ).strip()

              category = "Technical Insight"

              if category_match:

                  category = re.sub(
                      r"\s+",
                      " ",
                      category_match.group(1)
                  ).strip()

              date = ""

              if date_match:
                  date = date_match.group(0)

              articles.append({
                  "title": title,
                  "description": description,
                  "category": category,
                  "date": date,
                  "url": file.name
              })


          articles.sort(
              key=lambda x: x.get("date", ""),
              reverse=True
          )


          Path("articles.json").write_text(
              json.dumps(
                  articles,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"Generated articles.json "
              f"with {len(articles)} articles."
          )

          PY


      # ==========================================
      # Commit all changes
      # ==========================================

      - name: Commit updated articles
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.html articles.json

          if git diff --cached --quiet; then

              echo "No changes to commit."

          else

              git commit -m \
                "Unify article navigation and update article index"

              git push

          fi
