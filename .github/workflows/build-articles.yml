name: Build Articles and Shared Navigation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-articles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create shared navigation files
        shell: python
        run: |
          from pathlib import Path

          Path("nav.html").write_text(r'''<div class="shared-nav-header">
            <div class="shared-nav-inner">

              <a class="shared-logo" href="index.html">Jacky Liu</a>

              <nav id="main-nav" class="shared-main-nav">

                <div class="shared-nav-item">
                  <button class="shared-nav-link shared-dropdown-toggle" type="button">
                    CASE <span>▼</span>
                  </button>

                  <div class="shared-dropdown-menu">
                    <a href="index.html#case">Vehicle Monitor Projects</a>
                    <a href="index.html#case">SVM / AVM Projects</a>
                    <a href="index.html#case">Vehicle Safety Projects</a>
                  </div>
                </div>

                <div class="shared-nav-item">
                  <button class="shared-nav-link shared-dropdown-toggle" type="button">
                    INSIGHTS <span>▼</span>
                  </button>

                  <div id="shared-insights-dropdown" class="shared-dropdown-menu">
                    <div class="shared-dropdown-loading">Loading...</div>
                  </div>
                </div>

                <div class="shared-nav-item">
                  <button class="shared-nav-link shared-dropdown-toggle" type="button">
                    SOLUTION <span>▼</span>
                  </button>

                  <div class="shared-dropdown-menu">
                    <a href="index.html#solution">Vehicle Monitors</a>
                    <a href="index.html#solution">SVM / AVM Displays</a>
                    <a href="index.html#solution">Vehicle Safety</a>
                    <a href="index.html#solution">Wiring &amp; Connectivity</a>
                  </div>
                </div>

                <a class="shared-nav-link" href="index.html#about">ABOUT</a>
                <a class="shared-nav-link" href="index.html#contact">CONTACT</a>

              </nav>

              <button
                id="mobile-menu-toggle"
                class="shared-mobile-toggle"
                type="button"
                aria-label="Open menu"
              >☰</button>

            </div>
          </div>
          ''', encoding="utf-8")

          Path("nav.css").write_text(r'''#site-nav {
            position: sticky;
            top: 0;
            z-index: 9999;
            width: 100%;
          }

          #site-nav .shared-nav-header {
            width: 100%;
            background: #111827;
            border-bottom: 1px solid #1f2937;
          }

          #site-nav .shared-nav-inner {
            max-width: 1200px;
            min-height: 64px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
          }

          #site-nav .shared-logo {
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
          }

          #site-nav #main-nav {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: flex-end;
            gap: 24px;
          }

          #site-nav .shared-nav-item {
            position: relative;
          }

          #site-nav .shared-nav-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 10px 0;
            border: 0;
            background: transparent;
            color: #ffffff;
            text-decoration: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
          }

          #site-nav .shared-nav-link:hover {
            opacity: 0.75;
          }

          #site-nav .shared-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            min-width: 280px;
            max-width: 380px;
            padding: 10px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
            display: none;
          }

          #site-nav .shared-nav-item:hover > .shared-dropdown-menu,
          #site-nav .shared-nav-item.open > .shared-dropdown-menu {
            display: block;
          }

          #site-nav .shared-dropdown-menu a {
            display: block;
            padding: 10px 12px;
            color: #111827;
            text-decoration: none;
            font-size: 13px;
            line-height: 1.4;
            border-radius: 7px;
          }

          #site-nav .shared-dropdown-menu a:hover {
            background: #f3f4f6;
          }

          #site-nav .shared-dropdown-loading {
            padding: 10px 12px;
            color: #6b7280;
            font-size: 13px;
          }

          #site-nav .shared-mobile-toggle {
            display: none;
            border: 0;
            background: transparent;
            color: #ffffff;
            font-size: 25px;
            cursor: pointer;
          }

          @media (max-width: 768px) {

            #site-nav .shared-nav-inner {
              min-height: 60px;
              padding: 0 18px;
            }

            #site-nav #main-nav {
              display: none !important;
              position: absolute;
              top: 60px;
              left: 0;
              right: 0;
              padding: 16px 20px;
              background: #111827;
              flex-direction: column !important;
              align-items: flex-start !important;
              gap: 8px;
              border-top: 1px solid #1f2937;
            }

            #site-nav #main-nav.mobile-open {
              display: flex !important;
            }

            #site-nav .shared-nav-item {
              width: 100%;
            }

            #site-nav .shared-nav-link {
              width: 100%;
              padding: 10px 0;
            }

            #site-nav .shared-dropdown-menu {
              position: static;
              transform: none;
              width: 100%;
              max-width: none;
              margin-top: 4px;
              box-shadow: none;
            }

            #site-nav .shared-mobile-toggle {
              display: block;
            }
          }
          ''', encoding="utf-8")

          Path("nav.js").write_text(r'''(function () {

            function loadCSS() {
              if (document.querySelector('link[data-shared-nav-css]')) {
                return;
              }

              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = 'nav.css';
              link.dataset.sharedNavCss = 'true';

              document.head.appendChild(link);
            }

            async function loadNavigation() {

              loadCSS();

              const container = document.getElementById('site-nav');

              if (!container) {
                return;
              }

              try {

                const response = await fetch('nav.html', {
                  cache: 'no-store'
                });

                if (!response.ok) {
                  throw new Error('Failed to load nav.html');
                }

                container.innerHTML = await response.text();

                setupDropdowns();
                setupMobileMenu();
                loadInsights();

              } catch (error) {

                console.error(
                  'Shared navigation error:',
                  error
                );

              }
            }

            function setupDropdowns() {

              const buttons = document.querySelectorAll(
                '#site-nav .shared-dropdown-toggle'
              );

              buttons.forEach(function (button) {

                button.addEventListener(
                  'click',
                  function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                    const item =
                      button.closest('.shared-nav-item');

                    document
                      .querySelectorAll(
                        '#site-nav .shared-nav-item.open'
                      )
                      .forEach(function (other) {

                        if (other !== item) {
                          other.classList.remove('open');
                        }

                      });

                    item.classList.toggle('open');

                  }
                );

              });

              document.addEventListener(
                'click',
                function (event) {

                  if (
                    !event.target.closest(
                      '#site-nav .shared-nav-item'
                    )
                  ) {

                    document
                      .querySelectorAll(
                        '#site-nav .shared-nav-item.open'
                      )
                      .forEach(function (item) {

                        item.classList.remove('open');

                      });

                  }

                }
              );

            }

            function setupMobileMenu() {

              const toggle =
                document.getElementById(
                  'mobile-menu-toggle'
                );

              const nav =
                document.getElementById(
                  'main-nav'
                );

              if (!toggle || !nav) {
                return;
              }

              toggle.addEventListener(
                'click',
                function () {

                  nav.classList.toggle(
                    'mobile-open'
                  );

                }
              );

            }

            async function loadInsights() {

              const container =
                document.getElementById(
                  'shared-insights-dropdown'
                );

              if (!container) {
                return;
              }

              const insightGroups = {

                'Vehicle Monitors': [
                  'how-to-choose-vehicle-monitor.html',
                  '1920x1080-vs-1024x600.html',
                  'what-brightness-does-a-vehicle-monitor-need.html',
                  'why-vehicle-monitor-has-emi-problems.html',
                  'Why Is an Automotive Touchscreen Different from a Normal Tablet.html',
                  'why-vehicle-monitors-use-m12-connectors.html',
                  'bench-test-vs-installation.html'
                ],

                'SVM / AVM': [
                  'monitor-as-hmi-in-svm-system.html',
                  'svm-display-resolution-system-matching.html',
                  'why-svm-avm-needs-proper-display-interface.html',
                  'when-does-an-svm-monitor-need-touch.html',
                  '5-things-to-check-when-connecting-svm-box-to-vehicle-monitor.html',
                  'hdmi-vs-ahd-vehicle-camera-system.html'
                ],

                'Vehicle Safety': [
                  'why-wiring-matters.html',
                  'why-vehicle-camera-image-quality-changes-after-installation.html'
                ],

                'Wiring & Connectivity': [
                  'why-cables-can-matter-more-than-power-supply.html'
                ]

              };

              try {

                const response =
                  await fetch('articles.json', {
                    cache: 'no-store'
                  });

                if (!response.ok) {
                  throw new Error(
                    'Failed to load articles.json'
                  );
                }

                const articles =
                  await response.json();

                const articleMap = {};

                articles.forEach(function (article) {
                  articleMap[article.file] = article;
                });

                container.innerHTML = '';

                Object.entries(
                  insightGroups
                ).forEach(
                  function ([groupName, files]) {

                    const title =
                      document.createElement('div');

                    title.style.fontWeight = '700';
                    title.style.padding = '8px 12px 5px';
                    title.style.color = '#111827';
                    title.style.fontSize = '12px';

                    title.textContent = groupName;

                    container.appendChild(title);

                    files.forEach(function (fileName) {

                      const article =
                        articleMap[fileName];

                      if (!article) {
                        return;
                      }

                      const link =
                        document.createElement('a');

                      link.href = fileName;

                      link.textContent =
                        article.title || fileName;

                      container.appendChild(link);

                    });

                  }
                );

              } catch (error) {

                console.error(
                  'Failed to load shared INSIGHTS:',
                  error
                );

                container.innerHTML =
                  '<div class="shared-dropdown-loading">Unable to load articles.</div>';

              }

            }

            loadNavigation();

          })();
          ''', encoding="utf-8")

          print("nav.html created")
          print("nav.css created")
          print("nav.js created")

      - name: Update HTML pages
        shell: python
        run: |
          import re
          from pathlib import Path

          placeholder = '''<div id="site-nav"></div>
          <script src="nav.js"></script>'''

          for path in Path(".").glob("*.html"):

              if path.name == "404.html":
                  continue

              text = path.read_text(encoding="utf-8")

              text = re.sub(
                  r"<header\b[^>]*>.*?</header>",
                  placeholder,
                  text,
                  flags=re.IGNORECASE | re.DOTALL
              )

              if 'id="site-nav"' not in text:

                  text = re.sub(
                      r"<body\b[^>]*>",
                      lambda m:
                          m.group(0) + "\n" + placeholder,
                      text,
                      count=1,
                      flags=re.IGNORECASE
                  )

              if path.name == "index.html":

                  text = re.sub(
                      r"/\* ========================= INSIGHTS CATEGORY GROUPS ========================= \*/.*?(?=/\* ========================= START)",
                      "",
                      text,
                      flags=re.DOTALL
                  )

                  text = re.sub(
                      r"^\s*buildInsightsDropdown\(articles\);\s*$",
                      "",
                      text,
                      flags=re.MULTILINE
                  )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          print("HTML pages updated successfully.")

      - name: Check files
        shell: python
        run: |
          from pathlib import Path

          required = [
              "nav.html",
              "nav.css",
              "nav.js"
          ]

          for file in required:
              if not Path(file).exists():
                  raise SystemExit(
                      f"Missing required file: {file}"
                  )

          index = Path("index.html").read_text(
              encoding="utf-8"
          )

          if "INSIGHTS CATEGORY GROUPS" in index:
              raise SystemExit(
                  "Old INSIGHTS navigation code still exists."
              )

          if "buildInsightsDropdown(articles)" in index:
              raise SystemExit(
                  "Old buildInsightsDropdown call still exists."
              )

          print(
              "Old homepage navigation code successfully removed."
          )

      - name: Build articles.json
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          articles = []

          for path in sorted(
              Path(".").glob("*.html")
          ):

              if path.name in [
                  "index.html",
                  "404.html"
              ]:
                  continue

              text = path.read_text(
                  encoding="utf-8"
              )

              title_match = re.search(
                  r"<title>(.*?)</title>",
                  text,
                  re.IGNORECASE | re.DOTALL
              )

              description_match = re.search(
                  r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']',
                  text,
                  re.IGNORECASE | re.DOTALL
              )

              title = (
                  re.sub(
                      r"\s+",
                      " ",
                      title_match.group(1)
                  ).strip()
                  if title_match
                  else path.stem
              )

              description = (
                  re.sub(
                      r"\s+",
                      " ",
                      description_match.group(1)
                  ).strip()
                  if description_match
                  else ""
              )

              articles.append({
                  "file": path.name,
                  "title": title,
                  "description": description
              })

          Path("articles.json").write_text(
              json.dumps(
                  articles,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"Generated articles.json with {len(articles)} articles."
          )

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "*.html" \
            nav.html \
            nav.css \
            nav.js \
            articles.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update shared site navigation [skip ci]"
          git push
