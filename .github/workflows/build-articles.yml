name: Build Article Index

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix article navigation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          excluded = {
              "index.html",
              "404.html"
          }

          navigation_css = r"""
          /* =========================
             UNIFIED ARTICLE NAVIGATION
             ========================= */

          .nav {
              max-width: 1100px;
              margin: auto;
              padding: 20px 24px;
              display: flex;
              justify-content: space-between;
              align-items: center;
          }

          .logo {
              font-weight: bold;
              letter-spacing: 2px;
              color: white;
              white-space: nowrap;
          }

          #main-nav {
              display: flex;
              align-items: center;
              gap: 24px;
          }

          #main-nav > a {
              color: white;
              text-decoration: none;
              font-size: 14px;
              white-space: nowrap;
          }

          #main-nav > a:hover {
              color: #ccc;
          }

          #main-nav > .nav-item {
              position: relative;
          }

          #main-nav .nav-link {
              background: none;
              border: none;
              color: white;
              font-size: 14px;
              font-family: inherit;
              cursor: pointer;
              padding: 0;
              white-space: nowrap;
          }

          #main-nav .nav-link:hover {
              color: #ccc;
          }

          #main-nav .dropdown-arrow {
              font-size: 9px;
              margin-left: 4px;
          }

          #main-nav .dropdown-menu {
              display: none;
              position: absolute;
              top: 28px;
              left: 50%;
              transform: translateX(-50%);
              width: 360px;
              background: #111;
              border: 1px solid #333;
              padding: 18px;
              z-index: 1000;
              box-shadow: 0 10px 30px rgba(0,0,0,0.35);
          }

          #main-nav > .nav-item:hover > .dropdown-menu {
              display: block;
          }

          #main-nav .dropdown-inner {
              display: flex;
              flex-direction: column;
              gap: 18px;
          }

          #main-nav .dropdown-group-title {
              color: #999;
              font-size: 12px;
              letter-spacing: 1px;
              text-transform: uppercase;
              margin-bottom: 6px;
          }

          #main-nav .dropdown-link,
          #main-nav .dropdown-inner a {
              display: block;
              color: white;
              text-decoration: none;
              font-size: 13px;
              line-height: 1.5;
              margin: 6px 0;
          }

          #main-nav .dropdown-link:hover,
          #main-nav .dropdown-inner a:hover {
              color: #ccc;
          }

          .mobile-menu-toggle {
              display: none;
              background: none;
              border: none;
              color: white;
              font-size: 25px;
              cursor: pointer;
          }

          @media (max-width: 700px) {

              #main-nav {
                  display: none;
              }

              .mobile-menu-toggle {
                  display: block;
              }

              .nav {
                  padding: 18px 24px;
              }

              #main-nav .dropdown-menu {
                  display: none !important;
              }
          }
          """

          for file in Path(".").glob("*.html"):

              if file.name in excluded:
                  continue

              text = file.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              original = text

              # Remove accidental Markdown fences inside HTML
              text = re.sub(
                  r'^\s*```html\s*$',
                  '',
                  text,
                  flags=re.I | re.M
              )

              text = re.sub(
                  r'^\s*```\s*$',
                  '',
                  text,
                  flags=re.M
              )

              # Remove the old article navigation CSS
              text = re.sub(
                  r'/\*\s*=+\s*NAVIGATION\s*=+\s*\*/.*?(?=/\*\s*=+\s*HERO)',
                  '',
                  text,
                  flags=re.I | re.S
              )

              # Insert unified navigation CSS before </style>
              if "UNIFIED ARTICLE NAVIGATION" not in text:
                  text = text.replace(
                      "</style>",
                      navigation_css + "\n</style>",
                      1
                  )

              # Fix common navigation class mismatch
              text = text.replace(
                  'class="main-nav"',
                  'id="main-nav"'
              )

              # Fix the broken JavaScript declaration
              text = re.sub(
                  r'const articleInsightGroups\s*=\s*\{\s*\{',
                  'const articleInsightGroups = {',
                  text
              )

              if text != original:
                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

                  print(f"Fixed: {file.name}")
              else:
                  print(f"No change: {file.name}")

          PY

      - name: Generate articles.json
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          articles = []

          excluded = {
              "index.html",
              "404.html"
          }

          for file in Path(".").glob("*.html"):

              if file.name in excluded:
                  continue

              text = file.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              title_match = re.search(
                  r"<title[^>]*>(.*?)</title>",
                  text,
                  re.I | re.S
              )

              description_match = re.search(
                  r'<meta[^>]+name=["\']description["\'][^>]+content=["\'](.*?)["\']',
                  text,
                  re.I | re.S
              )

              category_match = re.search(
                  r'<div[^>]*class=["\'][^"\']*category[^"\']*["\'][^>]*>(.*?)</div>',
                  text,
                  re.I | re.S
              )

              date_match = re.search(
                  r'(January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},\s+\d{4}',
                  text,
                  re.I
              )

              if not title_match:
                  continue

              title = re.sub(
                  r"\s+",
                  " ",
                  title_match.group(1)
              ).strip()

              title = re.sub(
                  r"\s*\|\s*Jacky Liu\s*$",
                  "",
                  title,
                  flags=re.I
              )

              description = ""

              if description_match:
                  description = re.sub(
                      r"\s+",
                      " ",
                      description_match.group(1)
                  ).strip()

              category = "Technical Insight"

              if category_match:
                  category = re.sub(
                      r"\s+",
                      " ",
                      category_match.group(1)
                  ).strip()

              date = ""

              if date_match:
                  date = date_match.group(0)

              articles.append({
                  "title": title,
                  "description": description,
                  "category": category,
                  "date": date,
                  "url": file.name
              })

          articles.sort(
              key=lambda x: x.get("date", ""),
              reverse=True
          )

          Path("articles.json").write_text(
              json.dumps(
                  articles,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"Generated articles.json with {len(articles)} articles."
          )

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "*.html" articles.json

          git diff --cached --quiet || \
            git commit -m "Unify article navigation and update article index"

          git push
