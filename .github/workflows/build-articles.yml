name: Build Articles Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-articles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build articles.json
        shell: python {0}
        run: |
          from pathlib import Path
          import json
          import re
          from html import unescape

          articles = []

          excluded = {
              "index.html",
              "404.html",
              "nav.html"
          }

          for path in sorted(Path(".").glob("*.html")):
              if path.name in excluded:
                  continue

              content = path.read_text(encoding="utf-8")

              title_match = re.search(
                  r"<title\b[^>]*>(.*?)</title>",
                  content,
                  flags=re.IGNORECASE | re.DOTALL
              )

              description_match = re.search(
                  r'<meta\b[^>]*name=["\']description["\'][^>]*content=["\'](.*?)["\']',
                  content,
                  flags=re.IGNORECASE | re.DOTALL
              )

              title = (
                  unescape(
                      re.sub(
                          r"\s+",
                          " ",
                          title_match.group(1)
                      )
                  ).strip()
                  if title_match
                  else path.stem.replace("-", " ").title()
              )

              description = (
                  unescape(
                      re.sub(
                          r"\s+",
                          " ",
                          description_match.group(1)
                      )
                  ).strip()
                  if description_match
                  else ""
              )

              articles.append({
                  "file": path.name,
                  "title": title,
                  "description": description
              })

          Path("articles.json").write_text(
              json.dumps(
                  articles,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Generated articles.json with {len(articles)} articles."
          )

      - name: Check generated files
        shell: bash
        run: |
          set -e

          test -f nav.html
          test -f nav.css
          test -f nav.js
          test -f articles.json
          test -f index.html

          python - <<'PY'
          from pathlib import Path
          import json

          articles = json.loads(
              Path("articles.json").read_text(
                  encoding="utf-8"
              )
          )

          required_files = [
              "why-cables-can-matter-more-than-power-supply.html",
              "why-wiring-matters.html",
              "how-to-choose-vehicle-monitor.html",
              "1920x1080-vs-1024x600.html",
              "what-brightness-does-a-vehicle-monitor-need.html",
              "why-vehicle-monitor-has-emi-problems.html",
              "Why Is an Automotive Touchscreen Different from a Normal Tablet.html",
              "why-vehicle-monitors-use-m12-connectors.html",
              "bench-test-vs-installation.html",
              "why-vehicle-camera-image-quality-changes-after-installation.html",
              "hdmi-vs-ahd-vehicle-camera-system.html",
              "monitor-as-hmi-in-svm-system.html",
              "svm-display-resolution-system-matching.html",
              "why-svm-avm-needs-proper-display-interface.html",
              "when-does-an-svm-monitor-need-touch.html",
              "5-things-to-check-when-connecting-svm-box-to-vehicle-monitor.html"
          ]

          available = {
              item["file"]
              for item in articles
          }

          for file_name in required_files:
              if Path(file_name).exists() and file_name not in available:
                  raise SystemExit(
                      f"Article missing from articles.json: {file_name}"
                  )

          nav_html = Path("nav.html").read_text(
              encoding="utf-8"
          )

          nav_css = Path("nav.css").read_text(
              encoding="utf-8"
          )

          nav_js = Path("nav.js").read_text(
              encoding="utf-8"
          )

          required_navigation_files = [
              "nav.html",
              "nav.css",
              "nav.js"
          ]

          for file_name in required_navigation_files:
              if not Path(file_name).exists():
                  raise SystemExit(
                      f"Navigation file missing: {file_name}"
                  )

          required_navigation_items = [
              "CASE",
              "INSIGHTS",
              "SOLUTION",
              "ABOUT",
              "CONTACT"
          ]

          combined_navigation = (
              nav_html +
              nav_css +
              nav_js
          )

          for item in required_navigation_items:
              if item not in combined_navigation:
                  raise SystemExit(
                      f"Navigation item missing: {item}"
                  )

          required_insight_categories = [
              "International Logistics",
              "Wire & Cable",
              "Monitors",
              "Cameras",
              "MDVR",
              "SVM / AVM"
          ]

          for category in required_insight_categories:
              if category not in nav_js:
                  raise SystemExit(
                      f"Insights category missing: {category}"
                  )

          print(
              "Navigation files and article index checks passed."
          )
          PY

      - name: Commit and push generated articles.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add articles.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update articles index [skip ci]"
          git push
